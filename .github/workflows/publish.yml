name: Publish to PyPI

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to publish (e.g. v1.3.0)"
        required: true

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write  # PyPI trusted publishing (OIDC), no API token needed
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Check tag matches pyproject version
        run: |
          tag="${{ inputs.tag || github.ref_name }}"; tag="${tag#v}"
          ver=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          [ "$tag" = "$ver" ] || { echo "tag $tag != pyproject version $ver"; exit 1; }

      - name: Build sdist and wheel
        run: pipx run build

      - uses: pypa/gh-action-pypi-publish@release/v1
