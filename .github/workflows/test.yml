name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: test (${{ matrix.env }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        env: [cellina, cellina-gat]  # without / with the PyG `gat` extra
    permissions:
      id-token: write  # for codecov OIDC (no token needed)
    env:
      TORCH: "2.4.1"
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - name: Install CPU PyTorch
        run: pip install "torch==${TORCH}" --index-url https://download.pytorch.org/whl/cpu

      - name: Install PyG compiled deps (CPU wheels)
        if: matrix.env == 'cellina-gat'
        run: pip install torch-scatter torch-sparse -f "https://data.pyg.org/whl/torch-${TORCH}+cpu.html"

      - name: Install cellina with test extras
        run: pip install -e ".[test${{ matrix.env == 'cellina-gat' && ',gat' || '' }}]"

      - name: Run tests
        run: pytest --cov=cellina --cov-report=xml

      - name: Upload coverage to Codecov
        if: matrix.env == 'cellina-gat'
        uses: codecov/codecov-action@v5
        with:
          use_oidc: true
          files: ./coverage.xml
          fail_ci_if_error: false
